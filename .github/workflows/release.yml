name: Cross-Platform Release

on:
  push:
    branches: ["master"]

jobs:
  build-release:
    name: Build & Upload Binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          target: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        run: |
          mv target/${{ matrix.target }}/release/vipyrdocs${{ matrix.ext }} vipyrdocs-${{ matrix.target }}${{ matrix.ext }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: vipyrdocs-${{ matrix.target }}${{ matrix.ext }}
          path: vipyrdocs-${{ matrix.target }}${{ matrix.ext }}

  package-source:
    name: Package & Upload Source
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Package source code
        run: tar czvf vipyrdocs-source.tar.gz .
      - name: Upload source tarball
        uses: actions/upload-artifact@v4
        with:
          name: vipyrdocs-source.tar.gz
          path: vipyrdocs-source.tar.gz