[package]
name = "vipyrdocs"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "vipyrdocs"
path = "src/main.rs"  # Adjust if your binary source file is elsewhere

[dependencies]
lazy_static = "1.5.0"
regex = "1.11.1"
rustpython-ast = { version = "0.4.0", features = ["visitor"] }
rustpython-parser = "0.4.0"
rstest = "0.25.0"
clap = { version = "4.5", features = ["derive"] }
